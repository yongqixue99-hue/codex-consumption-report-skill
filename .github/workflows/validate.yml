name: Validate Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.mjs scripts/*.cjs; do
            node --check "$script"
          done
      - name: Check required distribution files
        shell: bash
        run: |
          set -euo pipefail
          test -s SKILL.md
          test -s LICENSE
          test -s NOTICE
          test -s assets/report.template.html
          test -s assets/vendor/echarts/echarts.min.js
          test -s assets/vendor/echarts/LICENSE.txt
          test -s assets/vendor/echarts/NOTICE.txt
          test -s assets/vendor/echarts/licenses/LICENSE-d3
